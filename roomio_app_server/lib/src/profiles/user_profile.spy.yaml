class: UserProfile
table: user_profile
fields:
  userId: String
  displayName: String
  bio: String?
  age: int
  gender: String
  occupation: String?
  city: String
  avatarUrl: String?
  isLookingForFlatmates: bool
  isLookingForRoom: bool
  createdAt: DateTime
indexes:
  user_profile_user_id_idx:
    fields: userId
    unique: true
  user_profile_city_idx:
    fields: city
